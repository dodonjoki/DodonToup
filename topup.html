<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Up - DodonTopUp</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script src="assets/script.js" defer></script>
</head>
<body>
  <header>
    <h1>Top Up Sekarang</h1>
  </header>

  <main>
    <form id="topupForm">
      <label>ID Pemain:</label>
      <input type="text" id="playerId" placeholder="Masukkan ID kamu" required />

      <label>Pilih Nominal:</label>
      <select id="nominal">
        <option value="50">50 Diamonds</option>
        <option value="100">100 Diamonds</option>
        <option value="200">200 Diamonds</option>
        <option value="500">500 Diamonds</option>
      </select>

      <button type="submit" class="btn">Bayar Sekarang</button>
    </form>
  </main>
</body>
</html>
